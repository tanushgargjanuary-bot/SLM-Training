[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-slm"
version = "0.1.0"
description = "Research code for recurrent computation in small language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<3",
  "transformers==4.57.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
