project:
  name: loop-slm
  status: design
  base_model: HuggingFaceTB/SmolLM2-135M
  model_revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  tokenizer_revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  seed: 42

architecture:
  recurrent_unit: full_decoder_stack
  embeddings_per_forward: 1
  final_norm_per_forward: 1
  lm_head_per_forward: 1
  kv_cache: false
  loop_counts: [1, 2, 3, 4, 6, 8]

training:
  mode: continued_pretraining
  optimizer: AdamW
  sequence_length_initial: 256
  effective_batch_tokens_initial: 2048
  max_steps_smoke: 5
  max_steps_pilot: 500
  precision: fp16
  gradient_checkpointing: true
  learning_rate: 0.00002
  warmup_steps: 25
  weight_decay: 0.1
  dataset: NOT_SELECTED
  dataset_revision: PINNED_BEFORE_RUN
  training_tokens: LOG_ACTUAL_COUNT

evaluation:
  validation_loss: true
  benchmarks:
    - wikitext-2
    - piqa
    - hellaswag
    - arc-easy
    - gsm8k
  benchmark_revisions: PINNED_BEFORE_RUN
  report:
    - parameter_count
    - training_tokens
    - optimizer_steps
    - estimated_or_measured_flops
    - step_time
    - inference_latency
    - peak_vram
    - validation_loss
    - benchmark_metrics

notes:
  - This is an initial pilot configuration, not a validated optimal hyperparameter set.
  - Keep token count, data order, seed, optimizer, and evaluation settings controlled across variants.
  - Equal optimizer steps and equal compute are different comparisons; report the distinction.
  - Do not launch the full matrix before a baseline smoke test and resource measurement.
