name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Validate Kaggle notebook JSON
        run: python -c "import json; json.load(open('notebooks/kaggle_gpu_smoke_test.ipynb', encoding='utf-8'))"
      - name: Apply safe Ruff autofixes
        run: ruff check --fix .
      - name: Lint
        run: ruff check .
